name: Daily Forecast

on:
  schedule:
    - cron: '23 0 * * *'  # 07:23 Pattaya time (UTC+7)
  workflow_dispatch:      # manual trigger for testing

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (includes trained models)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run forecast and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CITY: Pattaya
          LAT: "12.92"
          LON: "100.88"
        run: python src/run_forecast.py
